<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritwik.</title>
    <meta name="description" content="Ritwik Kumar — Data Science & Business Systems student at SRMIST. Building with GNNs, ML, and full-stack systems." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #070707;
        color: #e8e4de;
        overflow-x: hidden;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        cursor: none;
      }

      /* ——— Ambient drifting orbs (replaces universe.jpg) ——— */
      .ambient-stage {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 0%, rgba(30, 26, 38, 0.35), transparent 60%), #070707;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        mix-blend-mode: screen;
        opacity: 0.55;
        will-change: transform;
      }
      #orb-a {
        width: 560px;
        height: 560px;
        left: -120px;
        top: -100px;
        background: radial-gradient(circle at 30% 30%, rgba(130, 88, 180, 0.65), rgba(70, 40, 120, 0) 70%);
      }
      #orb-b {
        width: 640px;
        height: 640px;
        right: -160px;
        top: 35%;
        background: radial-gradient(circle at 40% 40%, rgba(60, 110, 180, 0.55), rgba(20, 40, 100, 0) 70%);
      }
      #orb-c {
        width: 480px;
        height: 480px;
        left: 30%;
        bottom: -120px;
        background: radial-gradient(circle at 50% 50%, rgba(180, 70, 90, 0.45), rgba(100, 30, 50, 0) 70%);
      }

      /* Starfield — subtle twinkling universe */
      #starfield {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.85;
      }

      /* ——— Fine grain noise layer ——— */
      .grain-bg {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.045;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }

      /* ——— Cursor spotlight that softly follows mouse ——— */
      #cursor-spot {
        position: fixed;
        top: 0;
        left: 0;
        width: 640px;
        height: 640px;
        margin-left: -320px;
        margin-top: -320px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(232, 228, 222, 0.08) 0%,
          rgba(232, 228, 222, 0.04) 25%,
          rgba(232, 228, 222, 0) 60%
        );
        pointer-events: none;
        z-index: 2;
        will-change: transform;
        mix-blend-mode: screen;
        transition: opacity 0.4s ease;
        opacity: 0;
      }
      #cursor-spot.active { opacity: 1; }

      /* ——— Vignette edge darkening ——— */
      #vignette {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      }

      /* ——— Cursor trail canvas ——— */
      #cursor-trail {
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
      }

      /* ——— Page transition overlay ——— */
      .page-fade {
        position: fixed;
        inset: 0;
        background: #070707;
        z-index: 10000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .page-fade.active {
        opacity: 1;
        pointer-events: all;
      }

      #root {
        position: relative;
        z-index: 10;
      }

      @media (hover: none), (pointer: coarse) {
        html, body { cursor: auto; }
        #cursor-spot, #cursor-trail { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Ambient background stage -->
    <div class="ambient-stage" aria-hidden="true">
      <canvas id="starfield"></canvas>
      <div class="orb" id="orb-a"></div>
      <div class="orb" id="orb-b"></div>
      <div class="orb" id="orb-c"></div>
    </div>

    <!-- Grain overlay -->
    <div class="grain-bg" aria-hidden="true"></div>

    <!-- Cursor spotlight -->
    <div id="cursor-spot" aria-hidden="true"></div>

    <!-- Vignette -->
    <div id="vignette" aria-hidden="true"></div>

    <!-- Cursor trail canvas -->
    <canvas id="cursor-trail" aria-hidden="true"></canvas>

    <!-- Page fade -->
    <div class="page-fade" id="page-fade" aria-hidden="true"></div>

    <!-- App root -->
    <div id="root"></div>

    <script>
      /* ══════════════════════════════════════════════
         Starfield — tiny drifting + twinkling stars
         ══════════════════════════════════════════════ */
      (function () {
        const canvas = document.getElementById("starfield");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w = 0, h = 0, dpr = window.devicePixelRatio || 1;
        let stars = [];
        let scrollOffset = 0;

        function makeStars() {
          const count = Math.min(360, Math.round((w * h) / 6500));
          stars = [];
          for (let i = 0; i < count; i++) {
            stars.push({
              x: Math.random() * w,
              y: Math.random() * h,
              r: Math.random() * 1.2 + 0.2,
              a: Math.random() * 0.5 + 0.25,
              tw: Math.random() * Math.PI * 2,
              twSpeed: Math.random() * 0.004 + 0.001,
              depth: Math.random() * 0.7 + 0.3, // parallax factor
            });
          }
        }

        function resize() {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          makeStars();
        }
        resize();
        window.addEventListener("resize", resize);
        window.addEventListener("scroll", () => { scrollOffset = window.scrollY; }, { passive: true });

        function loop() {
          ctx.clearRect(0, 0, w, h);
          for (const s of stars) {
            s.tw += s.twSpeed;
            const twinkle = 0.55 + 0.45 * Math.sin(s.tw);
            // Parallax: deeper stars drift slower with scroll
            const py = (s.y - scrollOffset * 0.08 * s.depth) % h;
            const yy = py < 0 ? py + h : py;
            ctx.beginPath();
            ctx.arc(s.x, yy, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232,228,222,${s.a * twinkle})`;
            ctx.fill();
            // Occasional soft glow on larger stars
            if (s.r > 1) {
              ctx.beginPath();
              ctx.arc(s.x, yy, s.r * 3, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(232,228,222,${s.a * twinkle * 0.08})`;
              ctx.fill();
            }
          }
          requestAnimationFrame(loop);
        }
        loop();
      })();

      /* ══════════════════════════════════════════════
         Ambient orb drift — organic sin/cos motion
         ══════════════════════════════════════════════ */
      (function () {
        const orbs = [
          { el: document.getElementById("orb-a"), phase: 0, sx: 80, sy: 60, rx: 0.00022, ry: 0.00018 },
          { el: document.getElementById("orb-b"), phase: 1.7, sx: 90, sy: 70, rx: 0.00017, ry: 0.00023 },
          { el: document.getElementById("orb-c"), phase: 3.1, sx: 100, sy: 50, rx: 0.00025, ry: 0.00015 },
        ];
        let start = performance.now();
        function loop(now) {
          const t = now - start;
          for (const o of orbs) {
            if (!o.el) continue;
            const x = Math.sin(t * o.rx + o.phase) * o.sx;
            const y = Math.cos(t * o.ry + o.phase * 1.3) * o.sy;
            o.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          }
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();

      /* ══════════════════════════════════════════════
         Cursor spotlight with lerp smoothing
         ══════════════════════════════════════════════ */
      (function () {
        const spot = document.getElementById("cursor-spot");
        if (!spot) return;
        let tx = window.innerWidth / 2;
        let ty = window.innerHeight / 2;
        let cx = tx;
        let cy = ty;
        let active = false;

        window.addEventListener("mousemove", (e) => {
          tx = e.clientX;
          ty = e.clientY;
          if (!active) {
            active = true;
            spot.classList.add("active");
          }
        });
        window.addEventListener("mouseleave", () => {
          active = false;
          spot.classList.remove("active");
        });

        function loop() {
          cx += (tx - cx) * 0.12;
          cy += (ty - cy) * 0.12;
          spot.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
          requestAnimationFrame(loop);
        }
        loop();
      })();

      /* ══════════════════════════════════════════════
         Cursor trail — small particles following cursor
         ══════════════════════════════════════════════ */
      (function () {
        const canvas = document.getElementById("cursor-trail");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);
        let dpr = window.devicePixelRatio || 1;

        function resize() {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener("resize", resize);

        const dots = [];
        const MAX = 22;
        let mx = -999;
        let my = -999;

        window.addEventListener("mousemove", (e) => {
          mx = e.clientX;
          my = e.clientY;
          dots.push({ x: mx, y: my, life: 1 });
          if (dots.length > MAX) dots.shift();
        });

        function draw() {
          ctx.clearRect(0, 0, w, h);
          // Main dot
          if (mx > -100) {
            ctx.beginPath();
            ctx.arc(mx, my, 4, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(232,228,222,0.9)";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(mx, my, 10, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(232,228,222,0.18)";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
          // Trailing particles
          for (let i = 0; i < dots.length; i++) {
            const d = dots[i];
            d.life *= 0.92;
            if (d.life < 0.04) continue;
            ctx.beginPath();
            ctx.arc(d.x, d.y, 2.5 * d.life, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232,228,222,${d.life * 0.5})`;
            ctx.fill();
          }
          requestAnimationFrame(draw);
        }
        draw();
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
